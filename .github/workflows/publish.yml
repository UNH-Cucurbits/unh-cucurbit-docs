# Renders the site and deploys it to GitHub Pages on every push to main.
# One-time setup: Settings > Pages > Source: "GitHub Actions".
# The custom domain is set in Settings > Pages; no CNAME file is needed.

name: Publish site

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time. A newer push waits for the current deploy
# instead of cancelling it partway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Pages with R or Python code are not executed here; their results come
      # from the committed _freeze/ folder.
      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
